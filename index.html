<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gym Log">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Gym Log</title>
<style>
:root{
  --bg:#ffffff; --surface:#f5f5f3; --ink:#111111; --muted:#74746f; --line:#e7e7e3;
  --accent:#d33a2c; --ok:#111111; --r:12px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
body{padding-top:env(safe-area-inset-top)}
#app{max-width:560px;margin:0 auto;min-height:100vh;padding:0 20px calc(96px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;cursor:pointer}
h1{font-size:34px;line-height:1.05;font-weight:800;letter-spacing:-.035em;margin:6px 0 6px}
h2{font-size:20px;font-weight:800;letter-spacing:-.02em;margin:32px 0 12px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sub{color:var(--muted);font-size:15px;margin:0 0 20px}
.fine{color:var(--muted);font-size:13px;line-height:1.45;margin:10px 0 0}

/* barra superior */
.topbar{display:flex;justify-content:space-between;align-items:center;height:52px;margin:0 -8px}
.link{background:none;border:0;font-weight:600;font-size:15px;padding:12px 8px}
.link.muted{color:var(--muted)}

/* semanas */
.weeks{display:flex;gap:8px;overflow-x:auto;margin:0 -20px 20px;padding:0 20px;scrollbar-width:none}
.weeks::-webkit-scrollbar{display:none}
.wk{flex:0 0 auto;min-width:48px;height:40px;border-radius:20px;border:1px solid var(--line);background:#fff;font-weight:700;font-size:14px;padding:0 14px}
.wk.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.bar{height:6px;background:var(--surface);border-radius:3px;overflow:hidden;margin:8px 0 6px}
.bar i{display:block;height:100%;background:var(--ink);border-radius:3px}
.barlabel{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:22px}

/* dias y ejercicios */
.daycard{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;background:var(--surface);border:0;border-radius:var(--r);padding:16px;margin-bottom:10px}
.daycard .t{font-size:18px;font-weight:700;letter-spacing:-.02em}
.daycard .s{font-size:13px;color:var(--muted);margin-top:3px}
.daycard.rest{background:#fff;border:1px dashed var(--line);color:var(--muted)}
.daycard.rest .t{font-weight:600;font-size:16px}
.tag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:var(--ink);color:#fff;border-radius:4px;padding:2px 6px;margin-left:8px;vertical-align:middle}
.chev{color:var(--muted);flex:0 0 auto}
.count{font-size:14px;font-weight:700}

.exrow{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:16px 0}
.exrow .num{flex:0 0 24px;font-size:13px;font-weight:700;color:var(--muted)}
.exrow .nm{flex:1;min-width:0}
.exrow .t{font-size:17px;font-weight:650;letter-spacing:-.015em}
.exrow .s{font-size:13px;color:var(--muted);margin-top:3px}
.state{flex:0 0 auto;min-width:26px;height:26px;border-radius:13px;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--muted);padding:0 6px}
.state.full{background:var(--ink);border-color:var(--ink);color:#fff}
.pill{font-size:12px;font-weight:700;border:1px solid var(--ink);border-radius:14px;padding:5px 11px}
.addrow{display:block;width:100%;text-align:center;background:none;border:1px dashed var(--line);border-radius:var(--r);padding:14px;margin-top:16px;font-weight:600;color:var(--muted)}

/* ejercicio */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px}
.chip{font-size:13px;font-weight:600;background:var(--surface);border-radius:8px;padding:6px 10px}
.last{background:var(--surface);border-radius:var(--r);padding:12px 14px;font-size:14px;line-height:1.4;margin-bottom:20px}
.last b{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:3px;font-weight:600}
.sethead,.set{display:grid;grid-template-columns:26px 1fr 66px 54px 38px;gap:8px;align-items:center}
.sethead{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:0 0 8px;border-bottom:1px solid var(--line)}
.sethead span:nth-child(n+3){text-align:center}
.set{padding:10px 0;border-bottom:1px solid var(--line)}
.set .n{font-weight:700;color:var(--muted);font-size:14px}
.set .tg b{display:block;font-size:15px;font-weight:700}
.set .tg span{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.in{width:100%;height:42px;border:1px solid var(--line);border-radius:10px;background:#fff;text-align:center;font:inherit;font-size:16px;font-weight:650;color:var(--ink);padding:0 4px;outline:none}
.in::placeholder{color:#b9b9b4;font-weight:500}
.in:focus{border-color:var(--ink)}
.chk{width:38px;height:38px;border-radius:19px;border:1.5px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;padding:0}
.chk svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.chk.on{background:var(--ink);border-color:var(--ink)}
.chk.on svg{opacity:1}
.set.isdone .tg{opacity:.55}
label.fl{display:block;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:24px 0 8px}
textarea.in{height:auto;min-height:84px;text-align:left;padding:12px;font-weight:500;line-height:1.4;resize:vertical}
input.in.left{text-align:left;padding:0 12px;font-weight:500}
.btn{display:inline-flex;align-items:center;justify-content:center;height:46px;padding:0 22px;border-radius:23px;border:0;background:var(--ink);color:#fff;font-weight:700;font-size:15px}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--ink)}
.btn.full{width:100%}
.btn.danger{background:#fff;color:var(--accent);border:1px solid var(--line)}
.row2{display:flex;gap:10px}
.row2>*{flex:1}

/* graficos */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:18px}
.stat{background:var(--surface);border-radius:var(--r);padding:12px}
.stat b{display:block;font-size:20px;font-weight:800;letter-spacing:-.03em;white-space:nowrap}
.stat span{font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.chartbox{margin-bottom:22px}
.chartbox .ct{font-size:14px;font-weight:700;margin-bottom:6px}
svg.ch{width:100%;height:auto;display:block}
.ch .gl{stroke:var(--line);stroke-width:1}
.ch .ax{fill:var(--muted);font-size:10px}
.ch .ln{fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.ch .dt{fill:#fff;stroke:var(--ink);stroke-width:2}
.ch .dt.hi{fill:var(--accent);stroke:var(--accent)}
.ch .vl{fill:var(--ink);font-size:10.5px;font-weight:700}
.empty{color:var(--muted);font-size:14px;background:var(--surface);border-radius:var(--r);padding:16px}

/* peso corporal */
.bw-row{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.bw-row b{font-size:17px}
.bw-row span{color:var(--muted);font-size:14px}
.x{background:none;border:0;color:var(--muted);font-size:20px;padding:4px 8px}

/* ajustes */
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.setrow .in{width:96px}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:5}
.tabbar .in-tabs{display:flex;width:100%;max-width:560px}
.tab{flex:1;border:0;background:none;padding:10px 0 9px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:#a3a39e}
.tab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--ink)}

/* hoja de edicion */
#sheet{position:fixed;inset:0;z-index:20;display:none}
#sheet.open{display:block}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.35)}
.panel{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:18px 18px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto;max-height:90vh;overflow:auto}
.panel h3{margin:0 0 4px;font-size:20px;letter-spacing:-.02em}
.err{color:var(--accent);font-size:13px;min-height:18px;margin:8px 0}
.check{display:flex;gap:10px;align-items:center;font-size:14px;margin:14px 0 4px}
.check input{width:20px;height:20px;accent-color:#111}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;font-weight:600;z-index:30}
</style>
</head>

        return {id:'w'+wi+'d'+di+'e'+ei,k:slug(e[0]),name:e[0],spec:e[1]};
      })};
    })};
  });
}

/* ================= series: parseo ================= */
function parseSpec(spec){
  var parts=String(spec).split('/').map(function(s){return s.trim();}).filter(Boolean);
  var groups=[];
  for(var i=0;i<parts.length;i++){
    var m=parts[i].match(/^(\d+)\s*[x×]\s*(\d+)\s*(")?\s*(.*)$/i);
    if(!m) return null;
    var g={n:+m[1],reps:+m[2],sec:!!m[3],t:null,v:null};
    var rest=m[4].trim(), r;
    if(rest){
      if((r=rest.match(/^RIR\s*(\d+(?:[.,]\d+)?)?$/i))){g.t='RIR';g.v=r[1]?num(r[1]):null;}
      else if((r=rest.match(/^RPE\s*(\d+(?:[.,]\d+)?)?$/i))){g.t='RPE';g.v=r[1]?num(r[1]):null;}
      else if((r=rest.match(/^(\d+(?:[.,]\d+)?)\s*%$/))){g.t='%';g.v=num(r[1]);}
      else if(/^m[aá]x/i.test(rest)){g.t='MAX';}
      else return null;
    }
    if(g.n<1||g.n>20) return null;
    groups.push(g);
  }
  return groups.length?groups:null;
}
function expandSets(spec){
  var out=[], g=parseSpec(spec)||[];
  g.forEach(function(x){for(var i=0;i<x.n;i++) out.push({reps:x.reps,sec:x.sec,t:x.t,v:x.v});});
  return out;
}
function intens(g){
  if(g.t==='%') return fmt(g.v)+'%';
  if(g.t==='MAX') return 'máx';
  if(g.t) return g.t+(g.v!=null?' '+fmt(g.v):'');
  return '';
}
function summary(spec){
  var g=parseSpec(spec); if(!g) return esc(spec);
  return g.map(function(x){return x.n+'×'+x.reps+(x.sec?' s':'')+(intens(x)?' '+intens(x):'');}).join(' · ');
}

/* ================= helpers de datos ================= */
function exIndex(){
  var m={};
  S.routine.forEach(function(w,wi){w.d.forEach(function(d,di){d.ex.forEach(function(e){m[e.id]={e:e,wi:wi,di:di};});});});
  return m;
}
function findEx(id){return exIndex()[id]||null;}
function getLog(id,n){
  var L=S.logs[id];
  if(!L) L={date:today(),sets:[],note:''};
  while(L.sets.length<n) L.sets.push({kg:'',reps:'',done:false});
  return L;
}
function ensureLog(id){
  var ref=findEx(id), n=ref?expandSets(ref.e.spec).length:0;
  var L=getLog(id,n);
  if(!S.logs[id]) S.logs[id]=L;
  return L;
}
function exStatus(e){
  var total=expandSets(e.spec).length, L=S.logs[e.id], done=0;
  if(L) L.sets.slice(0,total).forEach(function(s){if(s.done) done++;});
  return {done:done,total:total};
}
function weekProgress(wi){
  var done=0,total=0;
  S.routine[wi].d.forEach(function(d){d.ex.forEach(function(e){var s=exStatus(e);total++;if(s.total&&s.done===s.total)done++;});});
  return {done:done,total:total};
}
function suggest(e,set){
  var o=num(S.orm[e.k]);
  if(set.t==='%'&&o>0) return roundTo(o*set.v/100,2.5);
  return 0;
}
function sessionsOf(key){
  var idx=exIndex(), out=[];
  Object.keys(S.logs).forEach(function(id){
    var ref=idx[id]; if(!ref||ref.e.k!==key) return;
    var L=S.logs[id], sets=expandSets(ref.e.spec), maxKg=0,total=0,count=0;
    L.sets.forEach(function(s,i){
      var kg=num(s.kg), reps=num(s.reps), tgt=sets[i]?sets[i].reps:0;
      if(!(s.done||kg>0||reps>0)) return;
      total+= reps>0?reps:(s.done?tgt:0); count++; if(kg>maxKg) maxKg=kg;
    });
    if(!count) return;
    out.push({id:id,date:L.date,wi:ref.wi,di:ref.di,maxKg:maxKg,total:total});
  });
  out.sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:(a.wi-b.wi)||(a.di-b.di);});
  return out;
}
function prevSession(e,curDate){
  var h=sessionsOf(e.k).filter(function(x){return x.id!==e.id;});
  var before=h.filter(function(x){return x.date<=curDate;});
  var pick=before.length?before[before.length-1]:(h.length?h[h.length-1]:null);
  return pick;
}

/* ================= graficos ================= */
function tickFmt(v,range){return range>=6?String(Math.round(v)):fmt(+v.toFixed(1));}
function lineChart(pts,opt){
  opt=opt||{};
  var W=320,H=190,pl=34,pr=14,pt=24,pb=26;
  var ys=pts.map(function(p){return p.y;});
  var min=Math.min.apply(null,ys), max=Math.max.apply(null,ys);
  if(min===max){min-=1;max+=1;}
  var padv=(max-min)*.18; min-=padv; max+=padv;
  var iw=W-pl-pr, ih=H-pt-pb, n=pts.length, range=max-min;
  function X(i){return n===1?pl+iw/2:pl+iw*i/(n-1);}
  function Y(v){return pt+ih*(1-(v-min)/(max-min));}
  var g='',i;
  for(i=0;i<3;i++){
    var v=min+range*i/2, y=Y(v);
    g+='<line class="gl" x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y.toFixed(1)+'" y2="'+y.toFixed(1)+'"/>'+
       '<text class="ax" x="'+(pl-6)+'" y="'+(y+3).toFixed(1)+'" text-anchor="end">'+tickFmt(v,range)+'</text>';
  }
  var path=pts.map(function(p,i){return (i?'L':'M')+X(i).toFixed(1)+' '+Y(p.y).toFixed(1);}).join(' ');
  var hiIdx=-1;
  if(opt.hi==='max'){var best=-Infinity;pts.forEach(function(p,i){if(p.y>=best){best=p.y;hiIdx=i;}});}
  else if(opt.hi==='last'){hiIdx=n-1;}
  var small=n<=24, dots='',vals='';
  pts.forEach(function(p,i){
    var x=X(i),y=Y(p.y);
    dots+='<circle class="dt'+(i===hiIdx?' hi':'')+'" cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="'+(small?3.6:2.4)+'"/>';
    var showVal = n<=8 || i===n-1 || i===hiIdx;
    if(showVal){
      var anchor = x<pl+14?'start':(x>W-pr-14?'end':'middle');
      vals+='<text class="vl" x="'+x.toFixed(1)+'" y="'+(y-9).toFixed(1)+'" text-anchor="'+anchor+'">'+fmt(p.y)+'</text>';
    }
  });
  var xl='';
  var idxs=n===1?[0]:(n>=5?[0,Math.floor((n-1)/2),n-1]:[0,n-1]);
  idxs.forEach(function(i,k){
    var anchor = i===0&&n>1?'start':(i===n-1&&n>1?'end':'middle');
    xl+='<text class="ax" x="'+X(i).toFixed(1)+'" y="'+(H-6)+'" text-anchor="'+anchor+'">'+esc(pts[i].x)+'</text>';
  });
  return '<svg class="ch" viewBox="0 0 '+W+' '+H+'" role="img">'+g+(n>1?'<path class="ln" d="'+path+'"/>':'')+dots+vals+xl+'</svg>';
}

function chartsHTML(e){
  var sets=expandSets(e.spec), timeBased=sets.length&&sets[0].sec;
  var h=sessionsOf(e.k);
  if(!h.length) return '<div class="empty">Todavía no hay registros de este ejercicio. Cargá tus series y acá vas a ver cómo evoluciona.</div>';
  var hasKg=h.some(function(x){return x.maxKg>0;});
  var main=hasKg?h.map(function(x){return x.maxKg;}):h.map(function(x){return x.total;});
  var unit=hasKg?' kg':(timeBased?' s':' reps');
  var first=main[0], last=main[main.length-1], best=Math.max.apply(null,main), diff=last-first;
  var html='<div class="stats">'+
    '<div class="stat"><b>'+fmt(best)+'</b><span>Mejor'+unit+'</span></div>'+
    '<div class="stat"><b>'+fmt(last)+'</b><span>Última</span></div>'+
    '<div class="stat"><b>'+(diff>0?'+':'')+fmt(diff)+'</b><span>Evolución</span></div></div>';
  var labels=h.map(function(x){return dmy(x.date);});
  if(hasKg){
    html+='<div class="chartbox"><div class="ct">Peso máximo por sesión (kg)</div>'+
      lineChart(h.map(function(x,i){return {x:labels[i],y:x.maxKg};}),{hi:'max'})+'</div>';
  }
  html+='<div class="chartbox"><div class="ct">'+(timeBased?'Segundos totales por sesión':'Reps totales por sesión')+'</div>'+
    lineChart(h.map(function(x,i){return {x:labels[i],y:x.total};}),{hi:'max'})+'</div>';
  if(h.length<2) html+='<p class="fine">Con la segunda sesión empieza a dibujarse la línea. Las sesiones de este ejercicio se juntan de todas las semanas.</p>';
  else html+='<p class="fine">Se juntan todas las semanas en las que aparece este ejercicio. Marca roja = mejor marca.</p>';
  return html;
}

  if(st.mode==='edit'){var r=findEx(st.id);if(!r)return;e=r.e;}
  $('#sheet').innerHTML='<div class="scrim" data-act="sheet-cancel"></div><div class="panel">'+
    '<h3>'+(e?'Editar ejercicio':'Nuevo ejercicio')+'</h3>'+
    '<label class="fl" style="margin-top:14px">Nombre</label><input class="in left" id="sh-name" value="'+esc(e?e.name:'')+'" placeholder="Ej: Remo con flare elbows">'+
    (e?'<label class="check"><input type="checkbox" id="sh-all" checked> Cambiar el nombre en todas las semanas</label>':'')+
    '<label class="fl">Series</label><input class="in left" id="sh-spec" value="'+esc(e?e.spec:'')+'" placeholder="4x6 RIR 3">'+
    '<p class="fine">Formato: <b>series x reps + intensidad</b>. Ejemplos: 4x6 RIR 3 · 3x8 RPE 7 · 1x1 83% / 3x6 68% · 3x30" (segundos) · 1x1 máx</p>'+
    '<div class="err" id="sh-err"></div>'+
    '<div class="row2"><button class="btn ghost" data-act="sheet-cancel">Cancelar</button><button class="btn" data-act="sheet-save">Guardar</button></div>'+
    (e?'<button class="btn danger full" style="margin-top:10px" data-act="sheet-del">Eliminar ejercicio</button>':'')+
    '</div>';
  $('#sheet').classList.add('open');
}
function closeSheet(){$('#sheet').classList.remove('open');$('#sheet').innerHTML='';sheetState=null;}
function keyForName(name){
  var low=name.trim().toLowerCase(), found=null;
  S.routine.forEach(function(w){w.d.forEach(function(d){d.ex.forEach(function(e){if(!found&&e.name.toLowerCase()===low) found=e.k;});});});
  return found||slug(name)||newId();
}
function saveSheet(){
  var name=$('#sh-name').value.trim(), spec=$('#sh-spec').value.trim().replace(/“|”/g,'"');
  var err=$('#sh-err');
  if(!name){err.textContent='Poné un nombre para el ejercicio.';return;}
  if(!parseSpec(spec)){err.textContent='No entendí las series. Probá con algo como 4x6 RIR 3.';return;}
  var st=sheetState;
  if(st.mode==='add'){
    S.routine[S.ui.week].d[st.di].ex.push({id:newId(),k:keyForName(name),name:name,spec:spec});
  }else{
    var r=findEx(st.id), e=r.e;
    if(name!==e.name){
      var all=$('#sh-all')&&$('#sh-all').checked;
      if(all){var k=e.k;S.routine.forEach(function(w){w.d.forEach(function(d){d.ex.forEach(function(x){if(x.k===k)x.name=name;});});});}
      else{e.name=name;e.k=keyForName(name);}
    }
    e.spec=spec;
  }
  save();closeSheet();render();
}

/* ================= eventos ================= */
document.addEventListener('click',function(ev){
  var t=ev.target.closest('[data-act]'); if(!t) return;
  var a=t.dataset.act;
  if(a==='tab'){editing=false;go({tab:t.dataset.t,view:'home'});}
  else if(a==='week'){S.ui.week=+t.dataset.w;save();render();}
  else if(a==='day'){go({tab:'train',view:'day',d:+t.dataset.d});}
  else if(a==='ex'){go({tab:'train',view:'ex',d:nav.d,id:t.dataset.id});}
  else if(a==='back'){history.back();}
  else if(a==='toggle-edit'){editing=!editing;render();}
  else if(a==='edit-ex'){openSheet({mode:'edit',id:t.dataset.id});}
  else if(a==='add-ex'){openSheet({mode:'add',di:nav.d});}
  else if(a==='sheet-cancel'){closeSheet();}
  else if(a==='sheet-save'){saveSheet();}
  else if(a==='sheet-del'){
    if(confirm('¿Eliminar este ejercicio de la rutina? Sus registros quedan guardados pero ya no se muestran.')){
      var r=findEx(sheetState.id);
      S.routine[r.wi].d[r.di].ex=S.routine[r.wi].d[r.di].ex.filter(function(x){return x.id!==sheetState.id;});
      save();closeSheet();render();
    }
  }
  else if(a==='chk'){
    var i=+t.dataset.i, L=ensureLog(nav.id);
    L.sets[i].done=!L.sets[i].done; save();
    t.classList.toggle('on',L.sets[i].done);
    t.closest('.set').classList.toggle('isdone',L.sets[i].done);
    refreshCharts();
  }
  else if(a==='use-orm'){
    var ref=findEx(nav.id); S.orm[ref.e.k]=+t.dataset.v; save(); toast('1RM actualizado'); render();
  }
  else if(a==='copy-note'){
    var ref2=findEx(nav.id), L2=ensureLog(nav.id), ps=prevSession(ref2.e,L2.date);
    if(ps&&S.logs[ps.id]){L2.note=S.logs[ps.id].note;save();render();}
  }
  else if(a==='add-body'){
    var kg=num($('#bw-kg').value), d=$('#bw-date').value||today();
    if(!(kg>20&&kg<400)){toast('Ingresá un peso válido');return;}
    S.body=S.body.filter(function(x){return x.d!==d;}); S.body.push({d:d,kg:kg}); save(); render();
  }
  else if(a==='del-body'){
    if(confirm('¿Borrar este registro de peso?')){S.body=S.body.filter(function(x){return x.d!==t.dataset.d;});save();render();}
  }
  else if(a==='export'){doExport();}
  else if(a==='import'){$('#file').click();}
  else if(a==='reset-routine'){
    if(confirm('¿Restablecer la rutina original? Perdés las ediciones que hiciste a la rutina (tus registros se mantienen).')){
      S.routine=buildRoutine();S.ui.week=0;save();toast('Rutina restablecida');render();
    }
  }
});

function refreshCharts(){
  var box=$('#charts'); if(!box||nav.view!=='ex') return;
  var ref=findEx(nav.id); if(ref) box.innerHTML=chartsHTML(ref.e);
}

document.addEventListener('input',function(ev){
  var t=ev.target, f=t.dataset&&t.dataset.f; if(!f) return;
  if(f==='kg'||f==='reps'){
    var L=ensureLog(nav.id), i=+t.dataset.i;
    L.sets[i][f]=t.value; save(); refreshCharts();
  }else if(f==='note'){
    var L3=ensureLog(nav.id); L3.note=t.value; save();
  }else if(f==='date'){
    if(t.value){var L4=ensureLog(nav.id); L4.date=t.value; save(); refreshCharts();}
  }else if(f==='orm'){
    var v=num(t.value); if(v>0) S.orm[t.dataset.k]=v; else delete S.orm[t.dataset.k]; save();
  }
});

/* ================= backup ================= */
function doExport(){
  var data=JSON.stringify({app:'gymlog',v:1,exported:today(),routine:S.routine,logs:S.logs,body:S.body,orm:S.orm},null,1);
  var name='gym-log-backup-'+today()+'.json';
  var file=null;
  try{file=new File([data],name,{type:'application/json'});}catch(e){}
  if(file&&navigator.canShare&&navigator.canShare({files:[file]})){
    navigator.share({files:[file],title:'Gym Log backup'}).catch(function(){});
    return;
  }
  var a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));
  a.download=name;document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},500);
}
$('#file').addEventListener('change',function(ev){
  var f=ev.target.files&&ev.target.files[0]; if(!f) return;
  var r=new FileReader();
  r.onload=function(){
    try{
      var d=JSON.parse(r.result);
      if(!d||(typeof d!=='object')) throw 0;
      if(d.routine&&!Array.isArray(d.routine)) throw 0;
      if(!confirm('Importar esta copia reemplaza los datos actuales que estén en el archivo. ¿Continuar?')) return;
      if(d.routine) S.routine=d.routine;
      if(d.logs) S.logs=d.logs;
      if(d.body) S.body=d.body;
      if(d.orm) S.orm=d.orm;
      if(S.ui.week>=S.routine.length) S.ui.week=0;
      save();toast('Copia importada');render();
    }catch(e){toast('El archivo no es válido');}
    ev.target.value='';
  };
  r.readAsText(f);
});

/* ================= arranque ================= */
if(history.state&&history.state.tab) nav=history.state; else history.replaceState(nav,'');
render();
if(navigator.storage&&navigator.storage.persist){try{navigator.storage.persist();}catch(e){}}
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}
})();
</script>
</body>
</html>
